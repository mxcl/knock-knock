server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name knock-knock.mxcl.dev;

  ssl_certificate /etc/letsencrypt/live/knock-knock.mxcl.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/knock-knock.mxcl.dev/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 32k;

  location / {
    proxy_pass http://127.0.0.1:3008;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name knock-knock.mxcl.dev;

  return 301 https://knock-knock.mxcl.dev$request_uri;
}

